[project]
name = "analise-direcao"
version = "0.1.0"
description = "Extrator de métricas faciais (EAR, abertura da boca, pose da cabeça) para monitoramento do motorista"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
