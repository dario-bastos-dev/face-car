[project]
name = "analise-direcao"
version = "0.1.0"
description = "Captura de recortes do rosto do motorista para treinar um modelo de imagens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "tensorflow>=2.16,<2.21",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
